[package]
name = "myval-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
myval-core = { path = "../myval-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots", "gzip", "http2"] }
base64 = "0.22"
chrono = "0.4"
