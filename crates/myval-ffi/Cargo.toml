[package]
name = "myval-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
name = "myval_ffi"

[features]
default = []
bindgen-cli = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"
required-features = ["bindgen-cli"]

[dependencies]
myval-core = { path = "../myval-core" }
uniffi = { version = "0.28.3", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
thiserror = "2"
